# Metrics registry: every number on the site, typed once (plan §4, P2.T1).
# Pages reference rows by id with <Metric id="..." />; a literal number in MDX prose fails CI.
#
# How to complete a draft row (Aditya):
#   1. Fill what its `needs:` line asks for (baseline, evidence.n, evidence.ci, split, ...).
#   2. Change `status: draft` to `status: ready` and delete the `needs:` line.
#   3. `pnpm build` validates it. A row you cannot support gets deleted, not softened.
# Field rules are in src/content.config.ts. Units: percent | count | usd | ms | x.
# Qualifiers: approx (~), lt (<), gt (>), at_least (+).
# pdf_text must appear verbatim in public/resume.pdf (checked by scripts/check-resume.mjs).
#
# Seeded 2026-10-26 from Aditya_Rathi_MLE_2026 (2).docx. Left out on purpose:
#   - Kalshi "Live ECE < 6.8%": replaced by a recomputed SmoothECE from the live feed in P7.
#   - Kalshi "4.5K+ tests": demoted per plan §4; the page describes the fail-closed design instead.

