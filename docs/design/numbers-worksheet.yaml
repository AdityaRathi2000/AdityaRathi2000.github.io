# Numbers worksheet template (P2.T1). Aditya fills one row per résumé number.
# Rows that cannot be completed are deleted, not softened (plan §4).
# The completed file becomes src/content/metrics/metrics.yaml.
#
# Field rules
#   unit:        percent | count | usd | ms | x
#   provenance:  measured | reported | estimated
#   baseline:    required for every percent
#   evidence:    required when provenance = estimated and unit = percent
#   counts:      carry scope + as_of only (no CI)
#   pdf_text:    exact string that must appear in public/resume.pdf (CI greps for it)
#   BGI rows:    résumé + diagrams only; no unpublished numbers

- id: example-metric-id
  label: ""                 # short human label, sentence case
  value: null
  unit: percent
  scope: ""                 # population the number describes
  denominator: ""           # what it is a fraction of
  baseline:
    label: ""
    value: null
  as_of: "YYYY-MM-DD"
  provenance: measured
  evidence:
    n: null
    ci: [null, null]
    ci_method: ""           # e.g. block bootstrap by date, Wilson
    split: ""               # e.g. held-out gold set, time split
  group: ""                 # operating-point id shared by numbers that must move together
  caveat: ""
  pdf_text: ""

# Numbers the review flagged as needing support before they can appear (plan §4):
#   +35% canonical providers YoY      pairwise precision/recall on adjudicated sample; new sources vs better merging
#   77% of hardest residuals          define residual; how recovery was checked
#   88% NER F1                         gold-set size; annotator agreement
#   93% accuracy at 94% coverage       holdout size + CI (165M is the scored population, not the eval set)
#   +19% F1                            absolute before/after
#   16% AUC lift / 23% queue / 54% FP  absolute values; comparison window
#   ECE < 6.8%                         recompute as SmoothECE with n, CI, date
#   sub-2 s inference                  percentile, hardware, concurrency
#   BrainAI 77% F1                     session-level split, or drop
#   4.5K tests                         demote; describe fail-closed design and gate instead
#   first engineering hire / lead      team size, who reviews, named external consumers
