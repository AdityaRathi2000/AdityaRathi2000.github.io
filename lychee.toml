# Link check config. CI runs it twice:
#   blocking, on every PR:  --offline (internal links in dist/ only)
#   weekly, non-blocking:   external links too (.github/workflows/links-weekly.yml)
exclude_path = []
exclude = [
  # LinkedIn answers bots with 999.
  "^https://www\\.linkedin\\.com/",
  # USAJOBS answers scripted clients with 403 (checked 2026-10-31); the postings walkthrough links four announcements.
  "^https://www\\.usajobs\\.gov/",
]
accept = ["200..=299", "429"]
max_retries = 2
timeout = 20
